services:
  - type: web
    name: nyayalens-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nyayalens
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: NYAYALENS_ENABLE_DEMO_ANALYSIS
        value: "false"
